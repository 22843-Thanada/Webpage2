<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aimaam Galaxy Portfolio</title>

<style>

/* =========================================================
   🌌 VARIABLES
========================================================= */

:root{
    --bg:#02030d;
    --bg2:#07051c;

    --panel:rgba(12,17,45,.82);
    --panel2:rgba(20,15,55,.88);

    --cyan:#00f6ff;
    --blue:#3d8bff;
    --purple:#9147ff;
    --pink:#ff3cac;
    --yellow:#ffe45c;

    --white:#ffffff;
    --soft:#d4dcff;
    --muted:#8995bd;

    --border:rgba(0,246,255,.25);

    --max:1200px;
}


/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:
        "Noto Sans Thai",
        "Segoe UI",
        Arial,
        sans-serif;

    color:white;

    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(0,246,255,.13),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(145,71,255,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 80%,
            rgba(255,60,172,.10),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #01020a,
            #08051c,
            #03051a
        );
}


/* =========================================================
   🌌 MOVING STAR FIELD
========================================================= */

body::before{
    content:"";

    position:fixed;
    inset:0;

    z-index:-20;

    background-image:
        radial-gradient(
            white 1px,
            transparent 1.5px
        ),
        radial-gradient(
            var(--cyan) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            #a56bff 1px,
            transparent 1.7px
        );

    background-size:
        90px 90px,
        160px 160px,
        230px 230px;

    opacity:.45;

    animation:
        spaceMove 60s linear infinite;
}

@keyframes spaceMove{

    from{
        background-position:
            0 0,
            30px 50px,
            100px 20px;
    }

    to{
        background-position:
            500px 700px,
            -300px 400px,
            600px -300px;
    }
}


/* =========================================================
   🌈 NEBULA
========================================================= */

.nebula{
    position:fixed;

    width:600px;
    height:600px;

    border-radius:50%;

    pointer-events:none;

    z-index:-10;

    background:
        radial-gradient(
            circle,
            rgba(0,246,255,.14),
            rgba(145,71,255,.12),
            rgba(255,60,172,.06),
            transparent 70%
        );

    filter:blur(60px);

    animation:
        nebulaMove 14s ease-in-out infinite alternate;
}

.nebula.one{
    top:-180px;
    left:-180px;
}

.nebula.two{
    right:-180px;
    bottom:-150px;

    animation-delay:3s;
}

@keyframes nebulaMove{

    from{
        transform:
            scale(.8)
            rotate(0deg);
    }

    to{
        transform:
            scale(1.3)
            rotate(25deg);
    }
}


/* =========================================================
   🖱️ MOUSE GLOW
========================================================= */

.mouse-glow{
    position:fixed;

    width:300px;
    height:300px;

    border-radius:50%;

    pointer-events:none;

    z-index:9999;

    background:
        radial-gradient(
            circle,
            rgba(0,246,255,.12),
            transparent 65%
        );

    transform:
        translate(-50%,-50%);

    mix-blend-mode:screen;
}


/* =========================================================
   ⭐ FLOATING STARS
========================================================= */

.star{
    position:fixed;

    z-index:2;

    pointer-events:none;

    animation:
        starFloat 5s ease-in-out infinite,
        starGlow 3s ease-in-out infinite;
}

.s1{
    top:15%;
    left:4%;
    font-size:25px;
}

.s2{
    top:25%;
    right:5%;
    font-size:35px;
    animation-delay:1s;
}

.s3{
    top:48%;
    left:7%;
    font-size:20px;
    animation-delay:2s;
}

.s4{
    top:70%;
    right:8%;
    font-size:28px;
    animation-delay:.5s;
}

.s5{
    top:85%;
    left:15%;
    font-size:22px;
    animation-delay:1.5s;
}

@keyframes starFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateY(-25px)
            rotate(10deg);
    }
}

@keyframes starGlow{

    0%,100%{
        opacity:.3;
    }

    50%{
        opacity:1;

        filter:
            drop-shadow(0 0 8px white)
            drop-shadow(0 0 18px var(--cyan));
    }
}


/* =========================================================
   🛸 UFO
========================================================= */

.ufo{
    position:fixed;

    top:16%;
    right:-180px;

    z-index:4;

    font-size:65px;

    pointer-events:none;

    animation:
        ufoFly 18s linear infinite;
}

@keyframes ufoFly{

    0%{
        transform:
            translateX(0)
            translateY(0)
            rotate(-5deg);
    }

    45%{
        transform:
            translateX(-55vw)
            translateY(100px)
            rotate(6deg);
    }

    100%{
        transform:
            translateX(-130vw)
            translateY(-60px)
            rotate(-5deg);
    }
}


/* =========================================================
   ☄️ SHOOTING STAR
========================================================= */

.shooting{
    position:fixed;

    width:160px;
    height:3px;

    z-index:3;

    pointer-events:none;

    opacity:0;

    background:
        linear-gradient(
            90deg,
            transparent,
            white,
            var(--cyan)
        );

    box-shadow:
        0 0 10px var(--cyan),
        0 0 25px var(--cyan);

    transform:rotate(-35deg);

    animation:
        shooting 7s linear infinite;
}

.shooting.one{
    top:18%;
    right:5%;
}

.shooting.two{
    top:55%;
    right:20%;

    animation-delay:3s;
}

@keyframes shooting{

    0%{
        transform:
            translate(0,0)
            rotate(-35deg);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    35%{
        transform:
            translate(-450px,300px)
            rotate(-35deg);

        opacity:0;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   ⏳ LOADING SCREEN
========================================================= */

.loader{
    position:fixed;

    inset:0;

    z-index:10000;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:
        radial-gradient(
            circle,
            #11184a,
            #03040f 65%
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

.loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-planet{
    width:120px;
    height:120px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffffff,
            #00eaff 20%,
            #3d72ff 45%,
            #6f2bdb 70%,
            #080017 100%
        );

    box-shadow:
        0 0 30px var(--cyan),
        0 0 80px var(--purple);

    animation:
        loaderSpin 3s linear infinite;
}

@keyframes loaderSpin{

    to{
        transform:rotate(360deg);
    }
}

.loader h1{
    margin-top:30px;

    font-size:clamp(1.5rem,5vw,3rem);

    text-align:center;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--purple),
            var(--pink),
            var(--yellow)
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.loader p{
    color:var(--muted);

    margin-top:8px;
}


/* =========================================================
   🧭 NAVIGATION
========================================================= */

.header{
    position:fixed;

    top:0;
    left:0;
    right:0;

    z-index:500;

    background:
        rgba(2,3,13,.72);

    border-bottom:
        1px solid var(--border);

    backdrop-filter:
        blur(22px);
}

.nav{
    max-width:var(--max);

    min-height:76px;

    margin:auto;

    padding:
        0 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.logo{
    font-size:1.4rem;

    font-weight:900;

    white-space:nowrap;

    text-shadow:
        0 0 15px var(--cyan);
}

.logo span{
    color:var(--cyan);
}

.nav-links{
    display:flex;

    gap:5px;

    list-style:none;
}

.nav-links button{
    border:0;

    cursor:pointer;

    color:var(--soft);

    background:transparent;

    padding:
        10px 13px;

    border-radius:12px;

    font-size:.92rem;

    font-weight:800;

    transition:.3s;
}

.nav-links button:hover,
.nav-links button.active{
    color:var(--cyan);

    background:
        rgba(0,246,255,.08);

    box-shadow:
        0 0 20px rgba(0,246,255,.12);

    text-shadow:
        0 0 10px var(--cyan);
}


/* =========================================================
   📱 MOBILE MENU
========================================================= */

.menu-btn{
    display:none;

    width:45px;
    height:45px;

    border:1px solid var(--border);

    border-radius:12px;

    background:
        rgba(0,246,255,.08);

    color:white;

    font-size:1.5rem;

    cursor:pointer;
}

.mobile-menu{
    position:fixed;

    top:76px;
    left:15px;
    right:15px;

    z-index:490;

    padding:15px;

    display:none;

    background:
        rgba(5,7,25,.95);

    border:
        1px solid var(--border);

    border-radius:20px;

    backdrop-filter:blur(20px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);
}

.mobile-menu.open{
    display:block;

    animation:
        menuOpen .3s ease;
}

@keyframes menuOpen{

    from{
        opacity:0;
        transform:translateY(-15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.mobile-menu button{
    display:block;

    width:100%;

    padding:14px;

    margin-bottom:6px;

    border:0;

    border-radius:12px;

    background:transparent;

    color:white;

    text-align:left;

    font-weight:800;

    cursor:pointer;
}

.mobile-menu button:hover{
    background:
        rgba(0,246,255,.1);

    color:var(--cyan);
}


/* =========================================================
   📄 PAGE SYSTEM
========================================================= */

.page{
    display:none;

    min-height:100vh;

    padding:
        120px 20px 80px;

    max-width:var(--max);

    margin:auto;

    position:relative;
}

.page.active{
    display:block;

    animation:
        pageIn .55s ease;
}

@keyframes pageIn{

    from{
        opacity:0;
        transform:
            translateY(25px)
            scale(.98);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   🏠 HOME
========================================================= */

.home{
    min-height:100vh;

    display:grid;

    grid-template-columns:
        1.1fr .9fr;

    align-items:center;

    gap:70px;
}

.badge{
    display:inline-flex;

    padding:
        8px 16px;

    border-radius:999px;

    border:
        1px solid rgba(0,246,255,.5);

    background:
        rgba(0,246,255,.08);

    color:var(--cyan);

    font-weight:900;

    box-shadow:
        0 0 20px rgba(0,246,255,.15);
}

.home h1{
    margin-top:25px;

    font-size:
        clamp(3rem,7vw,6rem);

    line-height:1.05;

    font-weight:1000;
}

.gradient{
    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--blue),
            var(--purple),
            var(--pink),
            var(--yellow),
            var(--cyan)
        );

    background-size:400%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        gradientFlow 7s ease infinite;
}

@keyframes gradientFlow{

    0%{
        background-position:0%;
    }

    50%{
        background-position:100%;
    }

    100%{
        background-position:0%;
    }
}

.home-text{
    margin-top:25px;

    max-width:650px;

    color:var(--soft);

    font-size:1.1rem;

    line-height:1.9;
}

.btns{
    display:flex;

    gap:15px;

    flex-wrap:wrap;

    margin-top:30px;
}

.btn{
    border:0;

    cursor:pointer;

    text-decoration:none;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:
        14px 22px;

    border-radius:15px;

    font-weight:900;

    transition:.3s;
}

.btn-primary{
    color:white;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--cyan)
        );

    box-shadow:
        0 0 25px rgba(0,246,255,.3);
}

.btn-primary:hover{
    transform:
        translateY(-5px)
        scale(1.03);

    box-shadow:
        0 0 35px rgba(0,246,255,.6);
}

.btn-secondary{
    color:var(--cyan);

    background:
        rgba(0,246,255,.05);

    border:
        1px solid var(--cyan);
}

.btn-secondary:hover{
    background:
        rgba(0,246,255,.12);

    transform:
        translateY(-5px);
}


/* =========================================================
   🪐 PLANET
========================================================= */

.planet-area{
    display:grid;

    place-items:center;

    min-height:480px;
}

.planet{
    width:
        clamp(230px,30vw,360px);

    aspect-ratio:1;

    border-radius:50%;

    position:relative;

    background:
        radial-gradient(
            circle at 30% 22%,
            white 0%,
            #7df4ff 10%,
            #348cff 32%,
            #713bea 57%,
            #1c063f 80%,
            #03000b 100%
        );

    box-shadow:
        0 0 30px rgba(0,246,255,.7),
        0 0 80px rgba(145,71,255,.5),
        0 0 140px rgba(255,60,172,.2),
        inset -45px -40px 70px rgba(0,0,0,.7);

    animation:
        planetFloat 6s ease-in-out infinite,
        planetRotate 25s linear infinite;
}

.planet::before{
    content:"";

    position:absolute;

    width:145%;
    height:38%;

    top:32%;
    left:-22%;

    border:
        3px solid rgba(255,255,255,.55);

    border-radius:50%;

    transform:rotate(-17deg);

    box-shadow:
        0 0 10px white,
        0 0 30px var(--cyan);
}

.planet::after{
    content:"";

    position:absolute;

    inset:-45px;

    border:
        1px dashed rgba(0,246,255,.4);

    border-radius:50%;

    animation:
        orbit 15s linear infinite;
}

@keyframes planetFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateY(-20px)
            rotate(5deg);
    }
}

@keyframes planetRotate{

    from{
        filter:hue-rotate(0deg);
    }

    to{
        filter:hue-rotate(360deg);
    }
}

@keyframes orbit{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   📑 PAGE TITLE
========================================================= */

.page-title{
    text-align:center;

    margin-bottom:55px;
}

.page-title .mini{
    color:var(--cyan);

    font-weight:900;

    letter-spacing:2px;
}

.page-title h2{
    margin-top:10px;

    font-size:
        clamp(2.5rem,6vw,4.5rem);

    line-height:1.1;
}

.page-title p{
    margin:
        15px auto 0;

    max-width:700px;

    color:var(--soft);
}


/* =========================================================
   🪟 CARDS
========================================================= */

.grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:25px;
}

.grid.three{
    grid-template-columns:
        repeat(3,1fr);
}

.card{
    position:relative;

    overflow:hidden;

    padding:30px;

    border:
        1px solid var(--border);

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(20,27,65,.9),
            rgba(8,10,31,.88)
        );

    box-shadow:
        0 15px 40px rgba(0,0,0,.3);

    transition:.4s;
}

.card::before{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-80px;
    top:-80px;

    border-radius:50%;

    background:
        var(--purple);

    opacity:.12;

    filter:blur(30px);
}

.card:hover{
    transform:
        translateY(-10px)
        scale(1.015);

    border-color:
        rgba(0,246,255,.7);

    box-shadow:
        0 0 30px rgba(0,246,255,.15),
        0 25px 50px rgba(0,0,0,.45);
}

.card-icon{
    font-size:2.8rem;

    margin-bottom:15px;
}

.card h3{
    color:white;

    font-size:1.45rem;

    margin-bottom:10px;
}

.card p{
    color:var(--soft);

    line-height:1.8;
}


/* =========================================================
   👤 PROFILE
========================================================= */

.profile-grid{
    display:grid;

    grid-template-columns:
        380px 1fr;

    gap:35px;

    align-items:stretch;
}

.profile-photo-card{
    min-height:500px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:30px;

    border:
        1px solid var(--border);

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(18,27,70,.9),
            rgba(10,8,35,.9)
        );

    box-shadow:
        0 0 40px rgba(0,246,255,.1);
}

.profile-photo{
    width:240px;
    height:300px;

    object-fit:cover;

    object-position:center;

    border-radius:25px;

    border:
        3px solid var(--cyan);

    box-shadow:
        0 0 25px var(--cyan),
        0 0 60px rgba(145,71,255,.5);
}

.profile-photo-card h3{
    margin-top:22px;

    font-size:1.8rem;

    color:var(--yellow);
}

.profile-photo-card p{
    color:var(--soft);
}

.info-list{
    display:grid;

    gap:15px;
}

.info{
    padding:20px;

    border:
        1px solid var(--border);

    border-radius:18px;

    background:
        rgba(13,18,48,.75);

    transition:.3s;
}

.info:hover{
    transform:translateX(8px);

    border-color:var(--cyan);

    box-shadow:
        0 0 20px rgba(0,246,255,.12);
}

.info strong{
    display:block;

    color:var(--cyan);

    margin-bottom:4px;
}

.info span{
    color:var(--soft);
}


/* =========================================================
   🎓 EDUCATION
========================================================= */

.edu-card{
    min-height:230px;
}

.edu-number{
    width:55px;
    height:55px;

    display:grid;
    place-items:center;

    border-radius:50%;

    color:#000;

    font-weight:1000;

    font-size:1.3rem;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--yellow)
        );

    box-shadow:
        0 0 25px rgba(0,246,255,.4);

    margin-bottom:20px;
}


/* =========================================================
   🎨 HOBBY
========================================================= */

.hobby-card{
    text-align:center;

    min-height:270px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;
}

.hobby-icon{
    font-size:5rem;

    margin-bottom:15px;

    filter:
        drop-shadow(0 0 12px var(--cyan));
}


/* =========================================================
   📡 CONTACT
========================================================= */

.contact-card{
    text-align:center;

    min-height:220px;
}

.contact-icon{
