<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aimaam Galaxy Portfolio — Fixed</title>
<!-- FIXED: JS runs after the DOM + CSS emergency loader timeout -->

<style>
:root{
    --bg:#01020b;
    --bg2:#08051c;
    --cyan:#00f6ff;
    --blue:#398cff;
    --purple:#9147ff;
    --pink:#ff3cac;
    --yellow:#ffe45c;
    --green:#55ffb0;
    --white:#fff;
    --soft:#d9e0ff;
    --muted:#8995bd;
    --panel:rgba(9,14,40,.82);
    --border:rgba(0,246,255,.3);
    --max:1200px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    min-height:100vh;overflow-x:hidden;color:#fff;
    font-family:"Noto Sans Thai","Segoe UI",Arial,sans-serif;
    background:
      radial-gradient(circle at 20% 10%,rgba(0,246,255,.16),transparent 25%),
      radial-gradient(circle at 80% 20%,rgba(145,71,255,.18),transparent 30%),
      radial-gradient(circle at 50% 80%,rgba(255,60,172,.12),transparent 30%),
      linear-gradient(135deg,#01020b,#08051c,#020318);
}
body::before{
    content:"";position:fixed;inset:0;z-index:-50;
    background-image:
      radial-gradient(#fff 1px,transparent 1.5px),
      radial-gradient(var(--cyan) 1px,transparent 1.5px),
      radial-gradient(#a56bff 1px,transparent 1.7px);
    background-size:90px 90px,160px 160px,230px 230px;
    opacity:.45;animation:starField 55s linear infinite;
}
@keyframes starField{
    to{background-position:500px 700px,-300px 400px,600px -300px}
}
body::after{
    content:"";position:fixed;width:800px;height:800px;left:50%;top:20%;
    transform:translate(-50%,-50%);border-radius:50%;z-index:-40;
    pointer-events:none;
    background:radial-gradient(circle,rgba(0,246,255,.13),rgba(145,71,255,.1),rgba(255,60,172,.06),transparent 70%);
    filter:blur(55px);animation:nebulaMove 14s ease-in-out infinite alternate;
}
@keyframes nebulaMove{
    to{transform:translate(-42%,-35%) scale(1.25) rotate(20deg)}
}

#mouseGlow{
    position:fixed;width:320px;height:320px;border-radius:50%;
    pointer-events:none;z-index:9998;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(0,246,255,.16),rgba(145,71,255,.08),transparent 68%);
    mix-blend-mode:screen;
}
.pointerParticle{
    position:fixed;width:5px;height:5px;border-radius:50%;
    pointer-events:none;z-index:9997;background:var(--cyan);
    box-shadow:0 0 8px var(--cyan),0 0 18px var(--purple);
    animation:particleOut .8s forwards;
}
@keyframes particleOut{
    0%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}
}
.ripple{
    position:fixed;width:20px;height:20px;border:2px solid var(--cyan);
    border-radius:50%;pointer-events:none;z-index:10000;
    transform:translate(-50%,-50%);
    box-shadow:0 0 15px var(--cyan),0 0 30px var(--purple);
    animation:ripple .8s ease-out forwards;
}
@keyframes ripple{
    from{width:20px;height:20px;opacity:1}
    to{width:180px;height:180px;opacity:0}
}

.stars{position:fixed;inset:0;pointer-events:none;z-index:2}
.star{position:absolute;animation:starFloat 4s ease-in-out infinite}
.s1{left:4%;top:15%;font-size:26px}
.s2{right:5%;top:26%;font-size:35px;animation-delay:1s}
.s3{left:8%;top:52%;font-size:23px;animation-delay:2s}
.s4{right:9%;top:72%;font-size:30px;animation-delay:.6s}
.s5{left:18%;top:86%;font-size:21px;animation-delay:1.7s}
@keyframes starFloat{
    0%,100%{transform:translateY(0) rotate(0);opacity:.45}
    50%{transform:translateY(-25px) rotate(12deg);opacity:1;
        filter:drop-shadow(0 0 8px white) drop-shadow(0 0 18px var(--cyan))}
}

.spacePlanet,.saturn{position:fixed;border-radius:50%;pointer-events:none;z-index:1}
.spacePlanet{animation:planetFloat 8s ease-in-out infinite}
.planetBlue{
    width:75px;height:75px;top:20%;left:-20px;
    background:radial-gradient(circle at 30% 25%,#fff,#56eaff 15%,#267aff 45%,#16206e 75%,#050512);
    box-shadow:0 0 20px var(--cyan),0 0 50px rgba(0,246,255,.4);
}
.planetPurple{
    width:55px;height:55px;right:7%;top:43%;
    background:radial-gradient(circle at 30% 25%,#ffd9ff,#b967ff 30%,#6425c9 65%,#15062d);
    box-shadow:0 0 25px var(--purple);
}
.planetYellow{
    width:42px;height:42px;left:11%;bottom:18%;
    background:radial-gradient(circle at 30% 25%,#fff,#ffe45c 30%,#ff9d00 70%,#501600);
    box-shadow:0 0 20px var(--yellow);
}
@keyframes planetFloat{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-35px) rotate(180deg)}
}
.saturn{
    right:2%;bottom:8%;width:100px;height:100px;
    background:radial-gradient(circle at 30% 25%,#fff5c4,#e4b55b 25%,#a96b32 60%,#29130c);
    box-shadow:0 0 25px rgba(255,200,100,.5);
    animation:saturnFloat 7s ease-in-out infinite;
}
.saturn::before{
    content:"";position:absolute;width:165px;height:45px;left:-33px;top:28px;
    border:6px solid rgba(255,220,130,.55);border-radius:50%;
    transform:rotate(-15deg);box-shadow:0 0 15px rgba(255,220,130,.4);
}
@keyframes saturnFloat{
    50%{transform:translateY(-25px) rotate(8deg)}
}
.alien{
    position:fixed;left:-100px;top:62%;font-size:65px;z-index:4;
    pointer-events:none;animation:alienFly 19s linear infinite;
}
@keyframes alienFly{
    0%{transform:translateX(0) rotate(-8deg)}
    50%{transform:translateX(55vw) translateY(-100px) rotate(8deg)}
    100%{transform:translateX(115vw) translateY(50px) rotate(-5deg)}
}
.ufo{
    position:fixed;right:-120px;top:18%;font-size:60px;z-index:4;
    pointer-events:none;animation:ufoFly 17s linear infinite;
}
@keyframes ufoFly{
    0%{transform:translateX(0)}
    50%{transform:translateX(-60vw) translateY(90px) rotate(7deg)}
    100%{transform:translateX(-125vw) translateY(-40px)}
}
.shootingStar{
    position:fixed;width:150px;height:3px;border-radius:50%;
    background:linear-gradient(90deg,transparent,white,var(--cyan));
    box-shadow:0 0 10px white,0 0 25px var(--cyan);
    z-index:3;pointer-events:none;transform:rotate(-35deg);
    animation:shooting 1.3s linear forwards;
}
@keyframes shooting{
    0%{opacity:0;transform:translate(0,0) rotate(-35deg)}
    10%{opacity:1}
    100%{opacity:0;transform:translate(-500px,400px) rotate(-35deg)}
}

/* SHORT SAFE LOADER */
65%{opacity:1;visibility:visible}
    100%{opacity:0;visibility:hidden}
}
.loaderBox{width:min(90%,420px);text-align:center}
.loaderPlanet{
    width:90px;height:90px;margin:auto;border-radius:50%;
    background:radial-gradient(circle at 30% 25%,#fff 0%,#55eaff 18%,#6540ef 58%,#09021d 100%);
    box-shadow:0 0 25px var(--cyan),0 0 60px var(--purple);
    animation:loaderSpin 1.2s linear infinite;
}
@keyframes loaderSpin{to{transform:rotate(360deg)}}
.loaderTitle{margin-top:18px;font-size:clamp(1.8rem,7vw,3.2rem);font-weight:950}
.loaderText{margin-top:8px;color:var(--cyan);font-weight:800}
.loaderBar{width:min(270px,80vw);height:5px;margin:18px auto 0;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.1)}
.loaderBar i{
    display:block;width:0;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
    animation:loadFast .65s ease-out forwards;
}
@keyframes loadFast{to{width:100%}}

header{
    position:sticky;top:0;z-index:500;background:rgba(2,3,13,.75);
    border-bottom:1px solid var(--border);backdrop-filter:blur(20px);
}
nav{min-height:72px;display:flex;align-items:center;justify-content:space-between}
.container{width:min(calc(100% - 32px),var(--max));margin:auto}
.logo{
    border:0;background:none;color:#fff;font-weight:950;font-size:1.3rem;
    cursor:pointer;text-shadow:0 0 15px var(--cyan);
}
.logo b{color:var(--cyan)}
.nav{display:flex;gap:4px;list-style:none}
.nav button,.mobileBtn{
    border:0;background:transparent;color:var(--soft);cursor:pointer;
    padding:10px 12px;border-radius:12px;font-weight:850;transition:.25s;
}
.nav button:hover,.nav button.active{
    color:var(--cyan);background:rgba(0,246,255,.08);
    box-shadow:0 0 20px rgba(0,246,255,.15);
}
.mobileBtn{display:none;font-size:1.6rem}
.mobileMenu{display:none;padding:8px 0 14px}
.mobileMenu.open{display:block}
.mobileMenu button{
    width:100%;text-align:left;border:1px solid var(--border);
    background:rgba(255,255,255,.04);color:#fff;padding:13px;
    border-radius:12px;margin-top:6px;
}

main{position:relative;z-index:5}
.page{
    display:none;min-height:calc(100vh - 72px);padding:80px 0 100px;
    animation:pageIn .5s ease;
}
.page.active{display:block}
@keyframes pageIn{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:none}
}

.hero{
    min-height:calc(100vh - 72px);display:grid;
    grid-template-columns:1.05fr .95fr;gap:55px;align-items:center;
}
.eyebrow{
    display:inline-block;padding:8px 16px;border:1px solid var(--cyan);
    border-radius:999px;color:var(--cyan);background:rgba(0,246,255,.07);
    box-shadow:0 0 25px rgba(0,246,255,.2);font-weight:900;
}
.hero h1{font-size:clamp(3rem,7vw,6.5rem);line-height:1.03;margin:20px 0}
.gradient{
    background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple),var(--pink),var(--yellow),var(--cyan));
    background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:gradientMove 6s linear infinite;
}
@keyframes gradientMove{to{background-position:300% center}}
.hero p,.lead{color:var(--soft);font-size:1.12rem;max-width:720px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{
    border:1px solid var(--cyan);border-radius:14px;padding:12px 20px;
    text-decoration:none;font-weight:900;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--purple),var(--blue));
    box-shadow:0 0 25px rgba(0,246,255,.2);transition:.25s;
}
.btn:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 0 40px rgba(0,246,255,.45)}
.btn.alt{background:rgba(0,0,0,.25);color:var(--cyan)}

.planetBox{min-height:470px;display:grid;place-items:center;position:relative}
.heroPlanet{
    width:min(360px,70vw);aspect-ratio:1;border-radius:50%;position:relative;
    background:radial-gradient(circle at 30% 23%,#fff,#61eaff 12%,#278eff 35%,#6338e8 60%,#17072f 82%,#020108);
    box-shadow:0 0 35px var(--cyan),0 0 90px rgba(145,71,255,.55),0 0 150px rgba(255,60,172,.22),inset -45px -35px 70px #000;
    animation:heroPlanet 6s ease-in-out infinite;
}
.heroPlanet::before{
    content:"";position:absolute;width:145%;height:35%;left:-22%;top:34%;
    border:3px solid rgba(255,255,255,.55);border-radius:50%;transform:rotate(-17deg);
    box-shadow:0 0 25px var(--cyan);
}
.heroPlanet::after{
    content:"";position:absolute;inset:-45px;border:1px dashed rgba(0,246,255,.45);
    border-radius:50%;animation:orbit 16s linear infinite;
}
@keyframes heroPlanet{50%{transform:translateY(-20px) rotate(4deg)}}
@keyframes orbit{to{transform:rotate(360deg)}}

.title{text-align:center;margin-bottom:48px}
.title h2{font-size:clamp(2.3rem,5vw,4.2rem);line-height:1.1;margin-bottom:12px}
.title p{color:var(--soft)}
.grid{display:grid;gap:22px}
.two{grid-template-columns:repeat(2,1fr)}
.three{grid-template-columns:repeat(3,1fr)}
.four{grid-template-columns:repeat(4,1fr)}
.card{
    position:relative;overflow:hidden;
    background:linear-gradient(145deg,rgba(18,25,62,.92),rgba(7,9,28,.94));
    border:1px solid var(--border);border-radius:24px;padding:28px;
    box-shadow:0 18px 45px rgba(0,0,0,.3);
    transition:transform .18s ease,border .25s,box-shadow .25s;transform-style:preserve-3d;
}
.card::before{
    content:"";position:absolute;width:180px;height:180px;right:-80px;top:-80px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,246,255,.18),transparent 70%);pointer-events:none;
}
.card:hover{border-color:var(--cyan);box-shadow:0 0 35px rgba(0,246,255,.22),0 25px 60px rgba(0,0,0,.5)}
.card h3{color:var(--cyan);margin-bottom:10px;font-size:1.35rem}
.card p{color:var(--soft)}
.icon{font-size:2.5rem;margin-bottom:12px}

.profile{display:grid;grid-template-columns:340px 1fr;gap:35px;align-items:center}
.profilePic{
    width:280px;height:340px;object-fit:cover;display:block;margin:auto;
    border:2px solid var(--cyan);border-radius:35px;
    box-shadow:0 0 30px rgba(0,246,255,.35),0 0 80px rgba(145,71,255,.25);transition:.35s;
}
.profilePic:hover{transform:scale(1.04) rotate(-1deg);box-shadow:0 0 45px var(--cyan),0 0 100px var(--purple)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
.fact{padding:15px;border-radius:15px;background:rgba(255,255,255,.04);border:1px solid var(--border)}
.fact b{color:var(--yellow);display:block;margin-bottom:4px}
.edu .card{min-height:270px}
.year{font-size:2rem;font-weight:950;color:var(--purple);text-shadow:0 0 15px var(--purple)}
.hobbyCard{min-height:300px}
.hobbyCard:hover .icon{animation:iconBounce .6s ease}
@keyframes iconBounce{50%{transform:scale(1.4) rotate(12deg)}}
.contact .card{min-height:280px}
.contactText{word-break:break-word;color:var(--soft)}
.friends{font-size:1.12rem;line-height:2.2}
.tag{
    display:inline-block;color:var(--yellow);border:1px solid rgba(255,228,92,.4);
    padding:4px 10px;border-radius:999px;margin:3px;font-size:.9rem;
}
.achievement{min-height:280px}
.achievement strong{display:block;font-size:1.35rem;color:var(--yellow);margin-bottom:10px}
.big{font-size:3rem}
.character{
    font-size:4rem;text-align:center;margin-bottom:12px;
    filter:drop-shadow(0 0 12px rgba(0,246,255,.35));
    animation:characterFloat 3.5s ease-in-out infinite;
}
@keyframes characterFloat{50%{transform:translateY(-10px) rotate(3deg)}}
footer{text-align:center;color:var(--muted);padding:35px;border-top:1px solid var(--border)}
footer b{color:var(--cyan)}

@media(max-width:950px){
    .hero,.profile{grid-template-columns:1fr;text-align:center}
    .hero p{margin:auto}
    .two,.three,.four{grid-template-columns:repeat(2,1fr)}
    .nav{display:none}.mobileBtn{display:block}
    .profilePic{margin:auto}.spacePlanet,.saturn{opacity:.55}
}
@media(max-width:600px){
    .container{width:min(calc(100% - 24px),var(--max))}
    .page{padding:55px 0 80px}
    .two,.three,.four{grid-template-columns:1fr}
    .hero{min-height:auto;padding-top:35px}
    .planetBox{min-height:350px}
    .heroPlanet{width:230px}
    .profilePic{width:220px;height:285px}
    .facts{grid-template-columns:1fr}
    .ufo{font-size:42px}.alien{font-size:42px}
    .saturn{width:65px;height:65px}
    .saturn::before{width:110px;height:32px;left:-22px;top:17px}
}
@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;scroll-behavior:auto!important}
}

/* =========================================================
   ✨ EXTRA GALAXY DECORATIONS
========================================================= */
.galaxyDecor{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    overflow:hidden;
}

.nebulaBlob{
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    filter:blur(35px);
    opacity:.22;
    mix-blend-mode:screen;
    animation:nebulaBlob 12s ease-in-out infinite alternate;
}
.nb1{left:5%;top:30%;background:radial-gradient(circle,#00f6ff,transparent 70%);}
.nb2{right:3%;top:8%;background:radial-gradient(circle,#9147ff,transparent 70%);animation-delay:2s;}
.nb3{left:38%;bottom:-80px;background:radial-gradient(circle,#ff3cac,transparent 70%);animation-delay:4s;}
@keyframes nebulaBlob{
    to{transform:translate(35px,-45px) scale(1.22) rotate(20deg);}
}

.orb{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.35);
    background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.9),rgba(0,246,255,.25) 18%,rgba(145,71,255,.12) 45%,transparent 72%);
    box-shadow:0 0 25px rgba(0,246,255,.3), inset 0 0 18px rgba(255,255,255,.12);
    animation:orbFloat 7s ease-in-out infinite;
}
.o1{width:24px;height:24px;left:24%;top:18%;}
.o2{width:14px;height:14px;right:20%;top:60%;animation-delay:1.2s;}
.o3{width:32px;height:32px;right:34%;bottom:12%;animation-delay:2.5s;}
.o4{width:18px;height:18px;left:6%;bottom:35%;animation-delay:3.5s;}
@keyframes orbFloat{
    50%{transform:translateY(-28px) translateX(15px) scale(1.15);}
}

.constellation{
    position:absolute;
    width:150px;
    height:110px;
    opacity:.55;
}
.constellation::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 10% 75%,#fff 0 2px,transparent 3px),
      radial-gradient(circle at 35% 30%,#fff 0 2px,transparent 3px),
      radial-gradient(circle at 60% 70%,#fff 0 2px,transparent 3px),
      radial-gradient(circle at 88% 20%,#fff 0 2px,transparent 3px);
}
.constellation::after{
    content:"";
    position:absolute;
    left:12%;
    top:40%;
    width:95px;
    height:50px;
    border-top:1px solid rgba(0,246,255,.5);
    border-bottom:1px solid rgba(145,71,255,.35);
    transform:rotate(-15deg) skewX(-25deg);
}
.c1{right:12%;top:30%;transform:scale(.8);}
.c2{left:8%;bottom:15%;transform:scale(.65) rotate(15deg);}

.ringPlanet{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 25%,#fff,#7eeaff 15%,#2f61ff 45%,#14072c 78%);
    box-shadow:0 0 20px rgba(0,246,255,.55);
    animation:ringPlanet 9s ease-in-out infinite;
}
.ringPlanet::after{
    content:"";
    position:absolute;
    width:92px;
    height:25px;
    left:-17px;
    top:17px;
    border:3px solid rgba(255,255,255,.55);
    border-radius:50%;
    transform:rotate(-18deg);
    box-shadow:0 0 12px rgba(0,246,255,.45);
}
.rp1{left:14%;top:68%;}
.rp2{right:17%;top:75%;width:38px;height:38px;animation-delay:2s;}
@keyframes ringPlanet{
    50%{transform:translateY(-22px) rotate(12deg);}
}

.energyLine{
    position:absolute;
    width:240px;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);
    box-shadow:0 0 12px var(--cyan);
    opacity:.35;
    transform:rotate(-24deg);
    animation:energyMove 8s ease-in-out infinite;
}
.el1{left:-50px;top:46%;}
.el2{right:-80px;top:66%;transform:rotate(22deg);animation-delay:3s;}
@keyframes energyMove{
    50%{transform:translateX(80px) rotate(-24deg);opacity:.7;}
}

.profileFrame{
    position:relative;
    width:min(300px,80vw);
    margin:auto;
    padding:10px;
    border-radius:42px;
    background:linear-gradient(135deg,rgba(0,246,255,.8),rgba(145,71,255,.65),rgba(255,60,172,.55),rgba(0,246,255,.8));
    background-size:300% 300%;
    animation:frameShift 7s ease infinite;
    box-shadow:0 0 35px rgba(0,246,255,.28),0 0 80px rgba(145,71,255,.2);
}
.profileFrame::before,
.profileFrame::after{
    content:"";
    position:absolute;
    border:1px solid rgba(255,255,255,.5);
    border-radius:50%;
    pointer-events:none;
}
.profileFrame::before{
    inset:-18px;
    border-color:rgba(0,246,255,.35);
    transform:rotate(18deg);
}
.profileFrame::after{
    inset:-30px;
    border-color:rgba(255,60,172,.22);
    transform:rotate(-14deg);
}
.profileFrame .profilePic{
    width:100%;
    height:360px;
    margin:0;
    border:2px solid rgba(255,255,255,.65);
    border-radius:34px;
    object-fit:cover;
    object-position:center top;
    display:block;
    background:#050817;
}
@keyframes frameShift{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
}

.profileBadge{
    position:absolute;
    right:-18px;
    bottom:22px;
    z-index:3;
    padding:9px 14px;
    border:1px solid rgba(255,255,255,.45);
    border-radius:999px;
    background:rgba(4,8,25,.82);
    backdrop-filter:blur(12px);
    color:var(--cyan);
    font-weight:900;
    box-shadow:0 0 20px rgba(0,246,255,.3);
    animation:badgeFloat 3s ease-in-out infinite;
}
@keyframes badgeFloat{
    50%{transform:translateY(-8px) rotate(2deg);}
}

@media(max-width:600px){
