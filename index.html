<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galaxy Explorer | Portfolio</title>

<style>

/* =========================================================
   GALAXY GAME PORTFOLIO
========================================================= */

:root{
    --bg:#02030b;
    --bg2:#070b1d;
    --panel:rgba(10,15,40,.82);

    --cyan:#00f6ff;
    --blue:#398cff;
    --purple:#8c4dff;
    --pink:#ff3cac;

    --text:#f7fbff;
    --muted:#9eabc7;

    --border:rgba(0,246,255,.25);

    --glow:
        0 0 10px rgba(0,246,255,.6),
        0 0 30px rgba(0,100,255,.25);

    --mx:0px;
    --my:0px;
}

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:
        "Noto Sans Thai",
        "Segoe UI",
        Arial,
        sans-serif;

    color:var(--text);
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(0,246,255,.08),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 30%,
            rgba(140,77,255,.12),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #02030b,
            #05091b,
            #09021b
        );

    overflow-x:hidden;
}

/* =========================================================
   LOADING SCREEN
========================================================= */

#loading{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            #10194a,
            #02030b 65%
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#loading.hide{
    opacity:0;
    visibility:hidden;
}

.loading-box{
    text-align:center;
}

.loading-planet{
    width:110px;
    height:110px;

    margin:auto auto 30px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            white,
            #55eaff 15%,
            #276dff 40%,
            #5825b8 70%,
            #05000d
        );

    box-shadow:
        0 0 30px var(--cyan),
        0 0 80px var(--purple);

    animation:
        loadingPlanet 2s linear infinite;
}

@keyframes loadingPlanet{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

.loading-title{
    font-size:2rem;
    font-weight:900;

    letter-spacing:3px;

    text-shadow:
        0 0 15px var(--cyan);
}

.loading-text{
    margin-top:8px;
    color:var(--muted);
}

.loading-bar{
    width:260px;
    height:5px;

    margin:25px auto 0;

    background:rgba(255,255,255,.08);
    border-radius:20px;
    overflow:hidden;
}

.loading-progress{
    height:100%;
    width:0;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--purple),
            var(--pink)
        );

    box-shadow:
        0 0 15px var(--cyan);

    animation:
        loadingProgress 2.4s ease forwards;
}

@keyframes loadingProgress{
    to{
        width:100%;
    }
}

/* =========================================================
   GALAXY BACKGROUND
========================================================= */

.space-bg{
    position:fixed;
    inset:0;
    z-index:-10;

    pointer-events:none;

    background-image:
        radial-gradient(
            circle,
            white 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            var(--cyan) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            var(--purple) 1px,
            transparent 1.5px
        );

    background-size:
        90px 90px,
        150px 150px,
        240px 240px;

    animation:
        galaxyMove 45s linear infinite;

    opacity:.35;
}

@keyframes galaxyMove{

    0%{
        background-position:
            0 0,
            30px 50px,
            100px 20px;
    }

    100%{
        background-position:
            400px 600px,
            -250px 350px,
            500px -300px;
    }
}

/* =========================================================
   NEBULA
========================================================= */

.nebula{
    position:fixed;

    width:600px;
    height:600px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,246,255,.12),
            rgba(140,77,255,.09),
            transparent 70%
        );

    filter:blur(50px);

    pointer-events:none;

    z-index:-9;

    transform:
        translate(
            var(--mx),
            var(--my)
        );
}

   CURSOR GLOW
=============
